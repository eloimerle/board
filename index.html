function chooseMood(code, high, rainPct){
  if (rainPct >= 60 || (code >= 51 && code <= 99)) return "rain";
  if (high >= 32) return "hot";
  if (high <= 12) return "cold";
  if (code >= 2)  return "cloudy";
  return "sunny";
}
// Day-of-year, used to rotate the recommendations so they change daily
function dayOfYear(d){
  const start = new Date(d.getFullYear(), 0, 0);
  return Math.floor((d - start) / 86400000);
}
function matchTours(mood, dayNum, high){
  const fitsWeather = t => t.weather.includes(mood);
  // Temperature gates:
  //  - minTempCloudy: on a cloudy day, only show if warm enough (e.g. beach day)
  //  - maxTemp: only show if the day's high is below this (e.g. cassoulet)
  const tempOK = t => {
    if (mood === "cloudy" && typeof t.minTempCloudy === "number"){
      if (typeof high !== "number" || high < t.minTempCloudy) return false;
    }
    if (typeof t.maxTemp === "number"){
      if (typeof high !== "number" || high >= t.maxTemp) return false;
    }
    return true;
  };
  const eligible = t => fitsWeather(t) && tempOK(t);

  // Day-specific tours that fit (e.g. Tuesday market) always take priority
  let picks = TOURS.filter(t => eligible(t) && !t.days.includes("any") && t.days.includes(dayNum));

  // Any-day pool that fits the weather — rotate the order each day so
  // guests don't see the same three on consecutive same-weather days.
  let pool = TOURS.filter(t => eligible(t) && t.days.includes("any"));
  if (pool.length){
    const offset = dayOfYear(new Date()) % pool.length;
    pool = pool.slice(offset).concat(pool.slice(0, offset));  // rotate start point
  }
  for (const t of pool){ if (picks.length >= 3) break; if (!picks.includes(t)) picks.push(t); }

  // Fallback if nothing matched at all
  if (picks.length === 0){
    let fb = TOURS.filter(t => t.weather.includes("cloudy"));
    const offset = fb.length ? dayOfYear(new Date()) % fb.length : 0;
    fb = fb.slice(offset).concat(fb.slice(0, offset));
    picks = fb.slice(0,3);
  }
  return picks.slice(0,3);
}

  const pick = [others[start], others[(start+1) % others.length]];
  return `Domaine de la Senche, ${pick[0]} and ${pick[1]} lie within easy reach. Do call ahead to reserve your tasting, as most welcome visitors by appointment.`;
}
function carcassonneDesc(mood){
  const base = "Europe's finest walled medieval town, a UNESCO site half an hour away.";
  if (mood === "rain" || mood === "cloudy" || mood === "cold"){
    return base + " Atmospheric under grey skies, and far quieter then, too.";
  }
  return base + " The honey-coloured ramparts glow in the sun, so go early to beat the midday crowds.";
}
function beachDesc(){
  const spots = [
    "L'Hospitalet at Narbonne-Plage",
    "trendy Le Paparazzo at Gruissan",
    "Les Voiles at Portiragnes"
  ];
  const start = dayOfYear(new Date()) % spots.length;
  const pick = [spots[start], spots[(start+1) % spots.length]];
  return `Lounge beds, cocktails and seafood by the sea. Try ${pick[0]} or ${pick[1]}. The Mediterranean is about an hour away.`;
}
function limouxDesc(){
  const houses = ["Maison Guinot","Domaine J. Laurens"];
  const i = dayOfYear(new Date()) % 2;
  const order = i === 0 ? houses : [houses[1], houses[0]];
  return `${order[0]} and ${order[1]}, makers of sparkling Crémant since 1875. A characterful cellar tour forty-five minutes south, and a refreshing escape into the cool on a warm day.`;
}
function tourDesc(t, mood){
  if (t.dynamic === "winetrail") return wineTrailDesc();
  if (t.dynamic === "carcassonne") return carcassonneDesc(mood);
  if (t.dynamic === "beach") return beachDesc();
  if (t.dynamic === "limoux") return limouxDesc();
  return t.desc;
}
function renderTours(mood, dayNum, high){
  document.getElementById("tSub").textContent = MOOD_NOTE[mood] || "";
  const list = document.getElementById("tourList"); list.innerHTML = "";
  matchTours(mood, dayNum, high).forEach((t,i)=>{
    const el = document.createElement("div"); el.className = "tour";
    el.innerHTML = `<div class="num">${String(i+1).padStart(2,"0")}</div>
      <div class="body"><div class="t-title">${t.title}</div>
      <div class="t-desc">${tourDesc(t, mood)}</div></div>`;
    list.appendChild(el);
  });
}
function setDateClock(){
  const now = new Date();
  document.getElementById("dayName").textContent = now.toLocaleDateString("en-GB",{weekday:"long"});
  document.getElementById("dateFull").textContent = now.toLocaleDateString("en-GB",{day:"numeric",month:"long",year:"numeric"});
  document.getElementById("clock").textContent = now.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});
}
async function loadWeather(){
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}`
    + `&current=temperature_2m,weather_code`
    + `&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code`
    + `&timezone=Europe%2FParis&forecast_days=2`;
  const dayNum = new Date().getDay();
  try{
    const r = await fetch(url); const d = await r.json();
    const temp = Math.round(d.current.temperature_2m);
    const code = d.current.weather_code;
    const high = Math.round(d.daily.temperature_2m_max[0]);
    const low  = Math.round(d.daily.temperature_2m_min[0]);
    const rain = d.daily.precipitation_probability_max[0] ?? 0;
    const [label, icon] = WMO[code] || ["—","🌡️"];
    document.getElementById("wTemp").textContent = temp;
    document.getElementById("wIcon").textContent = icon;
    document.getElementById("wCond").textContent = label;
    document.getElementById("wHigh").textContent = high + "°";
    document.getElementById("wLow").textContent  = low + "°";
    document.getElementById("wRain").textContent = rain + "%";
    renderTours(chooseMood(code, high, rain), dayNum, high);

    // Tomorrow's glimpse (index 1 of the daily arrays)
    if (d.daily.time.length > 1){
      const tCode = d.daily.weather_code[1];
      const tHigh = Math.round(d.daily.temperature_2m_max[1]);
      const [tLabel, tIcon] = WMO[tCode] || ["—","🌡️"];
      document.getElementById("tmIcon").textContent = tIcon;
      document.getElementById("tmCond").textContent = tLabel;
      document.getElementById("tmTemp").textContent = tHigh + "°";
    }
  }catch(e){
    document.getElementById("wCond").innerHTML = '<span class="err">Weather offline, check the network</span>';
    renderTours("cloudy", dayNum);
  }
}
setDateClock(); loadWeather();
setInterval(setDateClock, 30*1000);
setInterval(loadWeather, 30*60*1000);

/* ---- Daily rollover ----
   Watches for the calendar day changing (e.g. at midnight) and refreshes
   the date and tour recommendations, even if the page is never reloaded.
   loadWeather() re-renders the tours with the new day, so we just trigger it. */
(function(){
  let lastDay = new Date().getDate();
  setInterval(function(){
    const today = new Date().getDate();
    if (today !== lastDay){
      lastDay = today;
      setDateClock();    // update the displayed date immediately
      loadWeather();     // re-fetch weather AND re-render tours for the new day
    }
  }, 60*1000);           // check once a minute
})();

/* ---- Auto-fit to any screen ----
   The board is a fixed 1280x720 stage. This scales that whole stage to fit
   the window, centred, whatever the screen shape or browser chrome (tabs,
   address bar). Because the stage size is fixed and known, the scale is a
   simple ratio with no measurement guesswork: it always fits. */
const STAGE_W = 1280, STAGE_H = 760;
const stage = document.getElementById("stage");
let fitScale = 1;
function computeFit(){
  fitScale = Math.min(window.innerWidth / STAGE_W, window.innerHeight / STAGE_H);
  fitScale = Math.floor(fitScale * 1000) / 1000;
  applyTransform();
}

/* ---- Burn-in protection: slow pixel drift ----
   Nudges the stage a few pixels on a slow cycle so no pixel stays lit in
   exactly the same spot. Imperceptible to viewers. The drift offset and the
   auto-fit scale are combined into one transform on the stage. */
let driftX = 0, driftY = 0;
function applyTransform(){
  stage.style.transform =
    `translate(${driftX}px, ${driftY}px) scale(${fitScale})`;
}
(function(){
  const RANGE = 8;          // max pixels of movement in any direction
  const points = [          // a slow loop around a small box
    [0,0],[RANGE,0],[RANGE,RANGE],[0,RANGE],
    [-RANGE,RANGE],[-RANGE,0],[-RANGE,-RANGE],[0,-RANGE],[RANGE,-RANGE]
  ];
  let i = 0;
  stage.style.transition = "transform 6s ease-in-out";
  function shift(){
    const [x,y] = points[i % points.length];
    driftX = x; driftY = y;
    applyTransform();
    i++;
  }
  shift();
  setInterval(shift, 60*1000);   // move once a minute
})();

// Fit immediately, on resize, and once fonts have settled.
computeFit();
window.addEventListener("resize", computeFit);
window.addEventListener("load", computeFit);
if (document.fonts && document.fonts.ready){
  document.fonts.ready.then(computeFit);
}
</script>
